<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#087a60"/></marker></defs><rect width="100%" height="100%" fill="#f6f9f6"/><text x="60" y="65" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#173c32">第二方确认时发生什么</text><text x="60" y="108" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#173c32">版本、确认、订单和档期在一个事务里检查和保存</text><rect x="80" y="160" width="200" height="64" rx="10" fill="#fff" stroke="#a6c5b8"/><text x="180" y="200" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#173c32">酒吧</text><path d="M180,225 V980" stroke="#91ad9f" stroke-width="2" stroke-dasharray="8 6"/><rect x="350" y="160" width="200" height="64" rx="10" fill="#fff" stroke="#a6c5b8"/><text x="450" y="200" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#173c32">艺人</text><path d="M450,225 V980" stroke="#91ad9f" stroke-width="2" stroke-dasharray="8 6"/><rect x="660" y="160" width="200" height="64" rx="10" fill="#fff" stroke="#a6c5b8"/><text x="760" y="200" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#173c32">业务 API</text><path d="M760,225 V980" stroke="#91ad9f" stroke-width="2" stroke-dasharray="8 6"/><rect x="970" y="160" width="200" height="64" rx="10" fill="#fff" stroke="#a6c5b8"/><text x="1070" y="200" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#173c32">订单模块</text><path d="M1070,225 V980" stroke="#91ad9f" stroke-width="2" stroke-dasharray="8 6"/><rect x="1310" y="160" width="200" height="64" rx="10" fill="#fff" stroke="#a6c5b8"/><text x="1410" y="200" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="middle" fill="#173c32">PostgreSQL</text><path d="M1410,225 V980" stroke="#91ad9f" stroke-width="2" stroke-dasharray="8 6"/><path d="M450,300 H760" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="605.0" y="286" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">1. 提交确认，携带条件版本与幂等键</text><path d="M760,374 H1410" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="1085.0" y="360" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">2. 开始事务，锁定洽谈；核对当前版本</text><path d="M760,448 H1410" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="1085.0" y="434" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">3. 保存本方确认，检查另一方同版确认</text><path d="M760,522 H1070" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="915.0" y="508" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">4. 双方已确认：请求创建订单</text><path d="M1070,596 H1410" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="1240.0" y="582" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">5. 保存订单、档期占用、费用估算和事件</text><path d="M1410,670 H1070" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="1240.0" y="656" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">6. 成功提交；冲突则整体回滚</text><path d="M1070,744 H760" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="915.0" y="730" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">7. 返回同一个订单 ID 或业务冲突</text><path d="M760,818 H450" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="605.0" y="804" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">8. 返回结果；重复请求返回原结果</text><path d="M760,892 H180" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><text x="470.0" y="878" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173c32">9. 提交后通知双方，可重试</text><text x="60" y="1050" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#173c32">通知失败不回滚已确认订单；档期冲突不能留下半份订单。</text></svg>