<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#087a60"/></marker></defs><rect width="100%" height="100%" fill="#f6f9f6"/><text x="60" y="65" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#173c32">图片与视频流程</text><text x="60" y="108" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#173c32">直传云服务，业务自己核对资源所有者、用途、审核与可见范围</text><path d="M800.0,270 V305.0 H800.0 V340" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M800.0,450 V485.0 H575.0 V520" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M800.0,450 V485.0 H1025.0 V520" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M575.0,630 V665.0 H800.0 V700" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025.0,630 V665.0 H800.0 V700" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M800.0,810 V845.0 H800.0 V880" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M800.0,990 V1025.0 H800.0 V1060" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><rect x="595.0" y="160" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="201" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">客户端申请上传</text><text x="800.0" y="229" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">用途、类型、大小</text><rect x="595.0" y="340" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="381" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">业务 API</text><text x="800.0" y="409" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">核对身份，创建 mediaId</text><rect x="370.0" y="520" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="561" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">图片 / 资质 → OSS</text><text x="575.0" y="589" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">短期上传授权，私有资质</text><rect x="820.0" y="520" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="561" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">作品视频 → VOD</text><text x="1025.0" y="589" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">短期上传地址与凭证</text><rect x="595.0" y="700" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="741" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">上传结束 / 云服务事件</text><text x="800.0" y="769" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">服务端核对，重复事件只处理一次</text><rect x="595.0" y="880" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="921" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">处理与审核通过</text><text x="800.0" y="949" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">业务状态和云服务状态分别保存</text><rect x="595.0" y="1060" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="1101" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">查看或播放</text><text x="800.0" y="1129" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">先核对权限，再给短期访问授权</text><text x="60" y="1272" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173c32">客户端上传成功不等于作品已公开。长期密钥只在服务端；失败与丢失事件要能补查。</text></svg>