<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1050" viewBox="0 0 1600 1050"><rect width="1600" height="1050" fill="#f6f9f6"/><text x="80" y="95" font-family="Arial, sans-serif" font-size="50" fill="#173c32" font-weight="700">How a booking works</text><text x="80" y="145" font-family="Arial, sans-serif" font-size="24" fill="#587168" font-weight="400">Music Bar Street · Request or invitation</text><rect x="80" y="190" width="1440" height="150" rx="16" fill="#fff" stroke="#d9e5df"/><rect x="106" y="217" width="82" height="82" rx="16" fill="#173c32" stroke="#173c32"/><text x="135" y="273" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="700">1</text><text x="220" y="249" font-family="Arial, sans-serif" font-size="31" fill="#173c32" font-weight="700">The bar posts a gig or invites a musician</text><text x="220" y="302" font-family="Arial, sans-serif" font-size="22" fill="#587168" font-weight="400">Date, venue, budget and performance requirements</text><rect x="80" y="375" width="1440" height="150" rx="16" fill="#fff" stroke="#d9e5df"/><rect x="106" y="402" width="82" height="82" rx="16" fill="#173c32" stroke="#173c32"/><text x="135" y="458" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="700">2</text><text x="220" y="434" font-family="Arial, sans-serif" font-size="31" fill="#173c32" font-weight="700">The musician responds; the bar picks someone</text><text x="220" y="487" font-family="Arial, sans-serif" font-size="22" fill="#587168" font-weight="400">Talk about the date, venue, fee and requirements.</text><rect x="80" y="560" width="1440" height="150" rx="16" fill="#fff" stroke="#d9e5df"/><rect x="106" y="587" width="82" height="82" rx="16" fill="#173c32" stroke="#173c32"/><text x="135" y="643" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="700">3</text><text x="220" y="619" font-family="Arial, sans-serif" font-size="31" fill="#173c32" font-weight="700">Both parties confirm the same terms</text><text x="220" y="672" font-family="Arial, sans-serif" font-size="22" fill="#587168" font-weight="400">Create the booking only after both confirm.</text><rect x="80" y="745" width="1440" height="150" rx="16" fill="#fff" stroke="#d9e5df"/><rect x="106" y="772" width="82" height="82" rx="16" fill="#173c32" stroke="#173c32"/><text x="135" y="828" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="700">4</text><text x="220" y="804" font-family="Arial, sans-serif" font-size="31" fill="#173c32" font-weight="700">Both parties record completion</text><text x="220" y="857" font-family="Arial, sans-serif" font-size="22" fill="#587168" font-weight="400">Keep the result and any changes or cancellation.</text><text x="80" y="1005" font-family="Arial, sans-serif" font-size="22" fill="#587168" font-weight="400">Performance fees are settled directly. Platform fees are recorded separately.</text></svg>