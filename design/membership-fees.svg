<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#087a60"/></marker></defs><rect width="100%" height="100%" fill="#f6f9f6"/><text x="60" y="65" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#173c32">会员与费用</text><text x="60" y="108" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#173c32">演出费、平台服务费、会员购买分别记，不把统计当收款</text><path d="M575.0,270 V305.0 H575.0 V340" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M575.0,270 V290 H25 V500 H575.0 V520" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M575.0,630 V665.0 H575.0 V700" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025.0,270 V305.0 H1025.0 V340" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025.0,450 V485.0 H1025.0 V520" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025.0,630 V665.0 H1025.0 V700" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><rect x="370.0" y="160" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="201" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">演出订单</text><text x="575.0" y="229" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">双方确认最终费用</text><rect x="820.0" y="160" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="201" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">商家选套餐</text><text x="1025.0" y="229" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">价格和权益快照</text><rect x="370.0" y="340" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="381" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">演出费线下结算</text><text x="575.0" y="409" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">订单保存说明</text><rect x="820.0" y="340" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="381" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">会员待支付订单</text><text x="1025.0" y="409" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">真实支付接入后才启用</text><rect x="370.0" y="520" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="561" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">服务费估算</text><text x="575.0" y="589" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">原想法 1%，尚未验证</text><rect x="820.0" y="520" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="561" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">服务端核实支付事实</text><text x="1025.0" y="589" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">去重，不能信客户端成功页</text><rect x="370.0" y="700" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="741" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">服务费记录</text><text x="575.0" y="769" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">预计 / 应收 / 实收分开</text><rect x="820.0" y="700" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="741" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">会员权益生效与到期</text><text x="1025.0" y="769" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">不绕过资料权限和审核</text><text x="60" y="912" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173c32">会员价格、支付服务商、取消费用和服务费收取时点还没定。未接支付时只登记购买意向。</text></svg>