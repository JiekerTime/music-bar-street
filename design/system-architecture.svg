ang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">基础沟通、权益、只读统计</text><rect x="145.0" y="700" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="350.0" y="741" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">PostgreSQL</text><text x="350.0" y="769" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">业务数据、确认、订单与审计</text><rect x="595.0" y="700" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="741" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">Redis</text><text x="800.0" y="769" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">会话、验证码、缓存、限流</text><rect x="1045.0" y="700" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1250.0" y="741" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">媒体模块</text><text x="1250.0" y="769" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">资源所有者、状态、访问授权</text><rect x="370.0" y="880" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="921" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">阿里云 OSS</text><text x="575.0" y="949" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">图片与私有资质</text><rect x="820.0" y="880" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="921" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">阿里云 VOD</text><text x="1025.0" y="949" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">视频上传、处理和播放</text><text x="60" y="1092" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173c32">审核操作在所属模块；一期不拆管理员服务。通知任务和外部支付按需接入。</text></svg>