<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1050" viewBox="0 0 1600 1050"><rect width="1600" height="1050" fill="#f6f9f6"/><text x="80" y="95" font-family="Arial, sans-serif" font-size="50" fill="#173c32" font-weight="700">The app I want to build</text><text x="80" y="145" font-family="Arial, sans-serif" font-size="24" fill="#587168" font-weight="400">Bars post gigs. Musicians apply. Both agree on the details.</text><rect x="80" y="205" width="700" height="248" rx="16" fill="#fff" stroke="#d9e5df"/><text x="110" y="260" font-family="Arial, sans-serif" font-size="23" fill="#087a60" font-weight="700">BARS</text><text x="110" y="323" font-family="Arial, sans-serif" font-size="22" fill="#173c32" font-weight="400">Post a gig or invite a musician.</text><text x="110" y="372" font-family="Arial, sans-serif" font-size="20" fill="#587168" font-weight="400">Agree on the date, venue, fee and requirements.</text><rect x="820" y="205" width="700" height="248" rx="16" fill="#fff" stroke="#d9e5df"/><text x="850" y="260" font-family="Arial, sans-serif" font-size="23" fill="#087a60" font-weight="700">MUSICIANS</text><text x="850" y="323" font-family="Arial, sans-serif" font-size="22" fill="#173c32" font-weight="400">Show your work and look for gigs.</text><text x="850" y="372" font-family="Arial, sans-serif" font-size="20" fill="#587168" font-weight="400">Check the date, quote a fee and confirm the booking.</text><rect x="80" y="490" width="700" height="248" rx="16" fill="#fff" stroke="#d9e5df"/><text x="110" y="545" font-family="Arial, sans-serif" font-size="23" fill="#087a60" font-weight="700">TRY IT LOCALLY</text><text x="110" y="608" font-family="Arial, sans-serif" font-size="22" fill="#173c32" font-weight="400">Start with bars and musicians you can reach.</text><text x="110" y="657" font-family="Arial, sans-serif" font-size="20" fill="#587168" font-weight="400">Find out where people need help getting a gig booked.</text><rect x="820" y="490" width="700" height="248" rx="16" fill="#fff" stroke="#d9e5df"/><text x="850" y="545" font-family="Arial, sans-serif" font-size="23" fill="#087a60" font-weight="700">THE FILES</text><text x="850" y="608" font-family="Arial, sans-serif" font-size="22" fill="#173c32" font-weight="400">Product and backend notes, diagrams and wireframes.</text><text x="850" y="657" font-family="Arial, sans-serif" font-size="20" fill="#587168" font-weight="400">Use them for your project, or work on it with me.</text><text x="80" y="875" font-family="Arial, sans-serif" font-size="24" fill="#173c32" font-weight="700">The app backend has not been built yet.</text><text x="80" y="925" font-family="Arial, sans-serif" font-size="22" fill="#587168" font-weight="400">Membership and a 1% service fee are ideas to test.</text><text x="80" y="984" font-family="Arial, sans-serif" font-size="20" fill="#587168" font-weight="400">Documents and diagrams: CC BY 4.0 · Website source: Apache-2.0 · Creator: JiekerTime</text></svg>