<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1520" viewBox="0 0 1600 1520"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#087a60"/></marker></defs><rect width="100%" height="100%" fill="#f6f9f6"/><text x="60" y="65" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#173c32">一场演出合作</text><text x="60" y="108" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#173c32">需求投递和主动邀请，最后进入同一套条件与订单规则</text><path d="M575.0,270 V305.0 H575.0 V340" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025.0,270 V305.0 H1025.0 V340" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M575.0,450 V485.0 H800.0 V520" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025.0,450 V485.0 H800.0 V520" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M800.0,630 V665.0 H800.0 V700" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M800.0,810 V845.0 H800.0 V880" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M800.0,990 V1025.0 H575.0 V1060" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M800.0,990 V1025.0 H1025.0 V1060" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M575.0,1170 V1205.0 H800.0 V1240" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025.0,1170 V1205.0 H800.0 V1240" fill="none" stroke="#087a60" stroke-width="2" marker-end="url(#arrow)"/><rect x="370.0" y="160" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="201" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">酒吧发布需求</text><text x="575.0" y="229" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">时间、预算、风格、场地</text><rect x="820.0" y="160" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="201" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">酒吧直接邀请</text><text x="1025.0" y="229" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">指定艺人，提出条件</text><rect x="370.0" y="340" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="381" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">艺人投递</text><text x="575.0" y="409" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">酒吧选择合适人选</text><rect x="820.0" y="340" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="381" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">艺人回应</text><text x="1025.0" y="409" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">愿意聊，或拒绝</text><rect x="595.0" y="520" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="561" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">沟通与商量条件</text><text x="800.0" y="589" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">预算、报价、最终费用分开</text><rect x="595.0" y="700" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="741" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">双方确认同一版本</text><text x="800.0" y="769" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">修改后，旧确认作废</text><rect x="595.0" y="880" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="921" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">确认订单</text><text x="800.0" y="949" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">保存快照，检查并占用档期</text><rect x="370.0" y="1060" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="575.0" y="1101" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">演出完成</text><text x="575.0" y="1129" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">双方分别确认</text><rect x="820.0" y="1060" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="1025.0" y="1101" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">取消 / 改期 / 争议</text><text x="1025.0" y="1129" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">协商处理，保留历史</text><rect x="595.0" y="1240" width="410" height="110" rx="12" fill="#fff" stroke="#a6c5b8" stroke-width="2"/><text x="800.0" y="1281" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#173c32">合作与费用记录</text><text x="800.0" y="1309" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#173c32">演出费线下结算；平台收款另记</text><text x="60" y="1452" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173c32">投递或接受邀约，只表示愿意沟通。双方确认后才成交。</text></svg>